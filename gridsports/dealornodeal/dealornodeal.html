<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Deal or No Deal</title>
    <style>
        :root {
            --bg-top: #2a5298;
            --bg-bottom: #1e3c72;
            --panel: rgba(0,0,0,0.3);
            --panel-strong: rgba(0,0,0,0.45);
            --text: #ffffff;
            --muted: #a8c5e0;
            --gold: #ffd700;
            --red: #c92a2a;
            --green: #22c55e;
            --green-text: #4ade80;
            --low-a: #3b82f6;
            --low-b: #1d4ed8;
            --high-a: #fcd34d;
            --high-b: #d97706;
            --case-a: #f5f6f8;
            --case-b: #b8bcc4;
            --case-c: #8d929b;
            --case-edge: #5f646d;
            --case-ink: #1a1a1a;
            color-scheme: dark;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg-top: #18315f;
                --bg-bottom: #0f2147;
                --panel: rgba(0,0,0,0.35);
                --panel-strong: rgba(0,0,0,0.5);
            }
        }
        :root[data-theme="dark"] {
            --bg-top: #18315f;
            --bg-bottom: #0f2147;
            --panel: rgba(0,0,0,0.35);
            --panel-strong: rgba(0,0,0,0.5);
        }
        html { scroll-padding-top: env(safe-area-inset-top, 0px); }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Arial Black', 'Arial Bold', Arial, Helvetica, sans-serif;
            background: var(--bg-bottom);
            background-image: radial-gradient(ellipse at top, var(--bg-top), var(--bg-bottom) 70%);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 20px;
            color: var(--text);
        }

        .container { max-width: 1400px; margin: 0 auto; }

        h1 {
            font-size: 3em;
            text-align: center;
            margin-bottom: 6px;
            color: var(--gold);
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }

        .subtitle {
            text-align: center;
            font-size: 1.1em;
            margin-bottom: 24px;
            color: var(--muted);
            min-height: 1.4em;
        }

        /* ---------- Stats bar ---------- */
        .stats-bar {
            background: var(--panel-strong);
            border-radius: 15px;
            padding: 16px 20px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .stat { text-align: center; min-width: 110px; }
        .stat-label { font-size: 0.85em; color: var(--muted); margin-bottom: 4px; }
        .stat-value { font-size: 1.8em; color: var(--gold); }
        .stat-value.green { color: var(--green-text); }

        button {
            font-family: inherit;
            background: var(--red);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.05em;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 3px 3px 8px rgba(0,0,0,0.3);
            transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
        }
        button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 4px 4px 12px rgba(0,0,0,0.4); }
        button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button.green { background: var(--green); }
        button.ghost { background: rgba(255,255,255,0.12); }

        /* ---------- Stage ---------- */
        .stage {
            display: grid;
            grid-template-columns: 170px 1fr 170px;
            gap: 24px;
            align-items: start;
        }

        .board {
            background: var(--panel);
            border-radius: 15px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }
        .chip {
            padding: 8px 10px;
            border-radius: 8px;
            text-align: right;
            font-size: 1.05em;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.3);
            transition: opacity 0.5s, filter 0.5s;
        }
        .chip.low  { background: linear-gradient(90deg, var(--low-b), var(--low-a)); color: #fff; }
        .chip.high { background: linear-gradient(90deg, var(--high-b), var(--high-a)); color: #1a1a1a; }
        .chip.gone { opacity: 0.22; filter: grayscale(1); text-decoration: line-through; }
        .chip.won  { outline: 3px solid var(--green-text); outline-offset: 2px; }
        .chip.flash { animation: flash 0.9s ease; }
        @keyframes flash {
            0%   { transform: scale(1);    filter: brightness(2.2); }
            40%  { transform: scale(1.08); filter: brightness(2.2); }
            100% { transform: scale(1); }
        }

        .center { min-width: 0; }

        .podium {
            background: var(--panel);
            border-radius: 15px;
            padding: 14px 20px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            min-height: 130px;
        }
        .podium-text { color: var(--muted); font-size: 1em; max-width: 220px; }
        .podium-text strong { display: block; color: var(--gold); font-size: 1.3em; }

        .reveal {
            text-align: center;
            font-size: 1.4em;
            min-height: 1.6em;
            margin-bottom: 14px;
        }
        .reveal span { display: inline-block; }
        .reveal .pop { animation: pop 0.5s ease; }
        .reveal .bad  { color: #ff6b6b; }
        .reveal .good { color: var(--green-text); }
        @keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 70% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }

        /* ---------- Briefcases ---------- */
        .cases-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 18px 12px;
        }
        .case {
            position: relative;
            aspect-ratio: 5 / 4;
            background: none;
            box-shadow: none;
            padding: 0;
            border-radius: 0;
            perspective: 700px;
            color: var(--case-ink);
        }
        .case:hover:not(:disabled) { transform: translateY(-4px); box-shadow: none; }
        .case:disabled { opacity: 1; cursor: default; }
        .case.yours-slot { visibility: hidden; }
        .case .inner {
            position: absolute;
            inset: 10px 0 0 0;
            transition: transform 0.6s ease;
            transform-style: preserve-3d;
        }
        .case.flipped .inner { transform: rotateY(180deg); }
        .face {
            position: absolute;
            inset: 0;
            border-radius: 8px;
            display: grid;
            place-items: center;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .front {
            background: linear-gradient(150deg, var(--case-a), var(--case-b) 55%, var(--case-c));
            border: 2px solid var(--case-edge);
            box-shadow: 3px 4px 8px rgba(0,0,0,0.4), inset 0 2px 0 rgba(255,255,255,0.6);
            font-size: clamp(1em, 2.2vw, 1.7em);
        }
        .front::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 34%;
            width: 32%;
            height: 11px;
            border: 3px solid var(--case-edge);
            border-bottom: none;
            border-radius: 7px 7px 0 0;
        }
        .front::after {
            content: '';
            position: absolute;
            left: 8%;
            right: 8%;
            top: 22%;
            height: 2px;
            background: rgba(0,0,0,0.15);
        }
        .front .num {
            background: rgba(255,255,255,0.85);
            border-radius: 6px;
            padding: 0 8px;
            position: relative;
            z-index: 1;
        }
        .back {
            transform: rotateY(180deg);
            background: #1d2433;
            border: 2px solid #3a4558;
            font-size: clamp(0.8em, 1.6vw, 1.2em);
            flex-direction: column;
        }
        .back.low  { color: #93c5fd; }
        .back.high { color: var(--gold); }
        .back small { display: block; font-size: 0.6em; color: var(--muted); text-align: center; }

        .case.big { width: 130px; flex-shrink: 0; }
        .case.big .front { font-size: 2em; border-color: var(--gold); box-shadow: 0 0 18px rgba(255,215,0,0.45), 3px 4px 8px rgba(0,0,0,0.4); }
        .case.big .back { font-size: 1.4em; }
        .case.big .back.low  { color: #93c5fd; }

        /* ---------- Lower panels ---------- */
        .lower {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-top: 24px;
        }
        .panel { background: var(--panel-strong); padding: 20px; border-radius: 15px; }
        .panel h3 { color: var(--gold); text-align: center; margin-bottom: 14px; font-size: 1.2em; }
        .history-list { max-height: 260px; overflow-y: auto; }
        .history-empty { color: var(--muted); text-align: center; font-size: 0.9em; }
        .history-item {
            background: rgba(30, 58, 138, 0.5);
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-size: 0.9em;
        }
        .history-item.taken { background: rgba(34,197,94,0.35); }
        .history-label { color: var(--muted); }
        .history-value { color: var(--gold); }
        .stat-row { display: flex; justify-content: space-between; padding: 7px 0; font-size: 0.95em; }
        .stat-row-label { color: var(--muted); }
        .stat-row-value { color: var(--green-text); }
        .stat-row-value.red { color: #ef4444; }
        .stat-row-value.yellow { color: var(--gold); }

        /* ---------- Modal ---------- */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: grid;
            place-items: center;
            padding: 20px;
            z-index: 20;
        }
        .overlay.hidden { display: none; }
        .modal {
            background: linear-gradient(160deg, #1f3f7a, #122a55);
            border: 3px solid var(--gold);
            border-radius: 18px;
            padding: 30px 28px;
            width: min(480px, 100%);
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            animation: pop 0.35s ease;
        }
        .modal h2 { color: var(--gold); font-size: 1.8em; margin-bottom: 10px; }
        .modal p { color: var(--muted); font-family: Arial, Helvetica, sans-serif; font-weight: bold; line-height: 1.45; margin: 8px 0; }
        .modal .big-amount { font-size: 3.2em; color: #fff; margin: 14px 0; text-shadow: 3px 3px 8px rgba(0,0,0,0.5); }
        .modal .actions { display: flex; gap: 14px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }
        .modal .actions button { flex: 1 1 140px; font-size: 1.25em; padding: 16px 20px; }
        .ringing { font-size: 3em; display: inline-block; animation: ring 0.5s ease-in-out infinite; }
        @keyframes ring { 0%,100% { transform: rotate(-12deg); } 50% { transform: rotate(12deg); } }

        @media (max-width: 1024px) {
            .stage { grid-template-columns: 1fr 1fr; }
            .center { grid-column: 1 / -1; order: -1; }
            .lower { grid-template-columns: 1fr; }
            h1 { font-size: 2.2em; }
        }
        @media (max-width: 640px) {
            body { padding: 12px; }
            .cases-grid { grid-template-columns: repeat(5, 1fr); gap: 16px 8px; }
            .stat { min-width: 80px; }
            .stat-value { font-size: 1.4em; }
            .stats-bar > div:last-child { width: 100%; }
            .stats-bar button { width: 100%; }
            .chip { font-size: 0.9em; padding: 6px 8px; }
            .case.big { width: 100px; }
            .podium { gap: 14px; padding: 12px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DEAL OR NO DEAL</h1>
        <p class="subtitle" id="status"></p>

        <div class="stats-bar">
            <div class="stat">
                <div class="stat-label">Round</div>
                <div class="stat-value" id="roundStat">–</div>
            </div>
            <div class="stat">
                <div class="stat-label">Cases opened</div>
                <div class="stat-value" id="casesOpened">0 / 24</div>
            </div>
            <div class="stat">
                <div class="stat-label">Open this round</div>
                <div class="stat-value green" id="toOpenStat">–</div>
            </div>
            <div class="stat">
                <div class="stat-label">Prizes left</div>
                <div class="stat-value green" id="prizesRemaining">26</div>
            </div>
            <div>
                <button class="ghost" onclick="newGame()">New game</button>
            </div>
        </div>

        <div class="stage">
            <div class="board" id="boardLow" aria-label="Low prizes"></div>

            <div class="center">
                <div class="podium" id="podium"></div>
                <div class="reveal" id="reveal" aria-live="polite"></div>
                <div class="cases-grid" id="casesGrid"></div>
            </div>

            <div class="board" id="boardHigh" aria-label="High prizes"></div>
        </div>

        <div class="lower">
            <div class="panel">
                <h3>Offer history</h3>
                <div class="history-list" id="historyList"></div>
            </div>
            <div class="panel">
                <h3>Remaining values</h3>
                <div class="stat-row"><span class="stat-row-label">Highest:</span><span class="stat-row-value" id="highestValue">$400</span></div>
                <div class="stat-row"><span class="stat-row-label">Lowest:</span><span class="stat-row-value red" id="lowestValue">1¢</span></div>
                <div class="stat-row"><span class="stat-row-label">Average:</span><span class="stat-row-value yellow" id="averageValue">$67</span></div>
            </div>
        </div>
    </div>

    <div class="overlay hidden" id="overlay">
        <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
    </div>

    <script>
        const PRIZES = [
            0.01, 0.05, 0.10, 0.25, 0.50, 1, 2, 3, 4, 5,
            10, 15, 20, 25, 30, 40, 50, 60, 75, 100,
            125, 150, 200, 250, 300, 400
        ];
        // Cases to open each round before the banker calls (6+5+4+3+2+1+1+1+1 = 24, leaving yours + one)
        const ROUNDS = [6, 5, 4, 3, 2, 1, 1, 1, 1];
        const TOTAL = PRIZES.length;
        const HIGH_START = 13; // index where the gold (high) column of the board begins

        let S; // game state

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function formatPrize(v) {
            if (v < 1) return `${Math.round(v * 100)}¢`;
            if (Number.isInteger(v)) return `$${v.toLocaleString()}`;
            return `$${v.toFixed(2)}`;
        }
        const roundMoney = v => (v >= 10 ? Math.round(v) : Math.round(v * 100) / 100);
        const isHigh = prize => PRIZES.indexOf(prize) >= HIGH_START;

        const caseByNum = n => S.cases[n - 1];
        const openedCount = () => S.cases.filter(c => c.opened).length;
        const remainingPrizes = () => S.cases.filter(c => !c.opened).map(c => c.prize);

        /* ---------- Setup ---------- */
        function newGame() {
            S = {
                cases: shuffle([...PRIZES]).map((prize, i) => ({ num: i + 1, prize, opened: false, shown: false })),
                player: null,
                phase: 'pick',      // pick → open → offer → (final) → over
                round: 0,
                toOpen: 0,
                offers: [],
                busy: false,
                result: null
            };
            closeModal();
            document.getElementById('reveal').innerHTML = '';
            buildBoard();
            buildCases();
            render();
        }

        function buildBoard() {
            const low = document.getElementById('boardLow');
            const high = document.getElementById('boardHigh');
            low.innerHTML = '';
            high.innerHTML = '';
            PRIZES.forEach((p, i) => {
                const chip = document.createElement('div');
                chip.className = 'chip ' + (i < HIGH_START ? 'low' : 'high');
                chip.id = `chip-${i}`;
                chip.textContent = formatPrize(p);
                (i < HIGH_START ? low : high).appendChild(chip);
            });
        }

        function caseMarkup(c, extra = '') {
            return `
                <div class="inner">
                    <div class="face front"><span class="num">${c.num}</span></div>
                    <div class="face back ${isHigh(c.prize) ? 'high' : 'low'}">
                        ${formatPrize(c.prize)}${extra}
                    </div>
                </div>`;
        }

        function buildCases() {
            const grid = document.getElementById('casesGrid');
            grid.innerHTML = '';
            S.cases.forEach(c => {
                const btn = document.createElement('button');
                btn.className = 'case';
                btn.id = `case-${c.num}`;
                btn.setAttribute('aria-label', `Case ${c.num}`);
                btn.innerHTML = caseMarkup(c);
                btn.onclick = () => clickCase(c.num);
                grid.appendChild(btn);
            });
        }

        /* ---------- Rendering ---------- */
        function render() {
            const playable = (S.phase === 'pick' || S.phase === 'open') && !S.busy;

            S.cases.forEach(c => {
                const btn = document.getElementById(`case-${c.num}`);
                btn.classList.toggle('flipped', c.opened || c.shown);
                btn.classList.toggle('yours-slot', c.num === S.player);
                btn.disabled = !playable || c.opened;
                btn.setAttribute('aria-label', c.opened || c.shown
                    ? `Case ${c.num}, held ${formatPrize(c.prize)}`
                    : `Case ${c.num}`);
            });

            // Prize board
            const gone = new Set(S.cases.filter(c => c.opened).map(c => c.prize));
            const wonPrize = S.result ? S.result.casePrize : null;
            PRIZES.forEach((p, i) => {
                const chip = document.getElementById(`chip-${i}`);
                chip.classList.toggle('gone', gone.has(p));
                chip.classList.toggle('won', S.phase === 'over' && p === wonPrize);
            });

            renderPodium();
            renderStats();
            renderHistory();
            renderStatus();
        }

        function renderPodium() {
            const podium = document.getElementById('podium');
            if (!S.player) {
                podium.innerHTML = `<div class="podium-text"><strong>Pick your case</strong>Whatever’s inside is yours… unless the banker buys it from you.</div>`;
                return;
            }
            const c = caseByNum(S.player);
            const flipped = S.phase === 'over' ? 'flipped' : '';
            const label = S.phase === 'over'
                ? `<strong>Your case held ${formatPrize(c.prize)}</strong>Case ${c.num}`
                : `<strong>Your case: #${c.num}</strong>Keep it safe.`;
            podium.innerHTML = `
                <div class="case big ${flipped}" aria-label="Your case, number ${c.num}">${caseMarkup(c)}</div>
                <div class="podium-text">${label}</div>`;
        }

        function renderStats() {
            const opened = openedCount();
            const remaining = remainingPrizes();
            const inPlay = S.phase !== 'pick';

            document.getElementById('roundStat').textContent =
                inPlay ? `${Math.min(S.round + 1, ROUNDS.length)} / ${ROUNDS.length}` : '–';
            document.getElementById('casesOpened').textContent = `${opened} / ${TOTAL - 2}`;
            document.getElementById('toOpenStat').textContent = S.phase === 'open' ? S.toOpen : '–';
            document.getElementById('prizesRemaining').textContent = remaining.length;

            if (remaining.length) {
                const avg = remaining.reduce((a, b) => a + b, 0) / remaining.length;
                document.getElementById('highestValue').textContent = formatPrize(Math.max(...remaining));
                document.getElementById('lowestValue').textContent = formatPrize(Math.min(...remaining));
                document.getElementById('averageValue').textContent = formatPrize(roundMoney(avg));
            }
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            if (!S.offers.length) {
                list.innerHTML = `<div class="history-empty">The banker calls after each round.</div>`;
                return;
            }
            list.innerHTML = S.offers.slice().reverse().map(o => `
                <div class="history-item ${o.taken ? 'taken' : ''}">
                    <span class="history-label">Round ${o.round} (${o.opened} opened)${o.taken ? ' · DEAL' : ''}</span>
                    <span class="history-value">${formatPrize(o.offer)}</span>
                </div>`).join('');
        }

        function renderStatus() {
            const el = document.getElementById('status');
            const s = S.toOpen === 1 ? '' : 's';
            el.textContent = {
                pick:  'Choose the case you want to keep.',
                open:  `Open ${S.toOpen} more case${s}, then the banker calls.`,
                offer: 'The banker is on the line…',
                final: 'Last decision: keep your case or swap it.',
                over:  'Game over. Hit “New game” to play again.'
            }[S.phase];
        }

        function showReveal(c) {
            const el = document.getElementById('reveal');
            const tone = isHigh(c.prize) ? 'bad' : 'good';
            el.innerHTML = `<span class="pop ${tone}">Case ${c.num}: ${formatPrize(c.prize)}</span>`;
            const chip = document.getElementById(`chip-${PRIZES.indexOf(c.prize)}`);
            chip.classList.remove('flash');
            void chip.offsetWidth; // restart animation
            chip.classList.add('flash');
        }

        /* ---------- Play ---------- */
        function clickCase(num) {
            if (S.busy) return;
            const c = caseByNum(num);

            if (S.phase === 'pick') {
                S.player = num;
                S.phase = 'open';
                S.toOpen = ROUNDS[0];
                render();
                return;
            }
            if (S.phase !== 'open' || c.opened || num === S.player) return;

            c.opened = true;
            S.busy = true;
            render();
            showReveal(c);

            setTimeout(() => {
                S.busy = false;
                S.toOpen--;
                if (S.toOpen === 0) bankerCalls();
                else render();
            }, 900);
        }

        // Your original banker formula, now driven by the cases actually opened
        function calculateOffer() {
            const remaining = remainingPrizes();
            if (remaining.length === 0) return 0;

            const average = remaining.reduce((a, b) => a + b, 0) / remaining.length;
            const percentOpened = openedCount() / TOTAL;

            let generosityFactor;
            if (percentOpened < 0.3) {
                generosityFactor = 0.15 + (percentOpened * 0.5);
            } else if (percentOpened < 0.6) {
                generosityFactor = 0.30 + (percentOpened * 0.6);
            } else {
                generosityFactor = 0.55 + (percentOpened * 0.4);
            }

            const randomFactor = 0.95 + (Math.random() * 0.1);
            return roundMoney(average * generosityFactor * randomFactor);
        }

        function bankerCalls() {
            S.phase = 'offer';
            render();
            openModal(`
                <div class="ringing" aria-hidden="true">📞</div>
                <h2>The banker is calling…</h2>`);

            setTimeout(() => {
                const offer = calculateOffer();
                const remaining = remainingPrizes();
                const avg = remaining.reduce((a, b) => a + b, 0) / remaining.length;
                const prev = S.offers[S.offers.length - 1];
                S.offers.push({ round: S.round + 1, opened: openedCount(), offer, taken: false });
                render();

                openModal(`
                    <h2>BANKER’S OFFER</h2>
                    <div class="big-amount">${formatPrize(offer)}</div>
                    <p>${remaining.length} cases left · average ${formatPrize(roundMoney(avg))}</p>
                    ${prev ? `<p>Last offer was ${formatPrize(prev.offer)}</p>` : ''}
                    <div class="actions">
                        <button class="green" onclick="takeDeal()">DEAL</button>
                        <button onclick="noDeal()">NO DEAL</button>
                    </div>`);
            }, 1400);
        }

        function takeDeal() {
            const last = S.offers[S.offers.length - 1];
            last.taken = true;
            finish({ type: 'deal', amount: last.offer, casePrize: caseByNum(S.player).prize });
        }

        function noDeal() {
            closeModal();
            S.round++;
            if (S.round < ROUNDS.length) {
                S.phase = 'open';
                S.toOpen = ROUNDS[S.round];
                render();
                return;
            }
            // Only your case and one other remain
            S.phase = 'final';
            render();
            const other = S.cases.find(c => !c.opened && c.num !== S.player);
            const [a, b] = remainingPrizes().sort((x, y) => x - y);
            openModal(`
                <h2>Final decision</h2>
                <p>It’s down to your case #${S.player} and case #${other.num}.</p>
                <p>One holds ${formatPrize(a)}. The other holds ${formatPrize(b)}.</p>
                <div class="actions">
                    <button class="green" onclick="finalChoice(false)">Keep #${S.player}</button>
                    <button onclick="finalChoice(true)">Swap for #${other.num}</button>
                </div>`);
        }

        function finalChoice(swap) {
            const other = S.cases.find(c => !c.opened && c.num !== S.player);
            const mine = caseByNum(S.player);
            const win = swap ? other : mine;
            const lose = swap ? mine : other;
            finish({ type: swap ? 'swap' : 'keep', amount: win.prize, casePrize: win.prize, winNum: win.num, loseNum: lose.num, losePrize: lose.prize });
        }

        function finish(result) {
            S.phase = 'over';
            S.result = result;
            S.cases.forEach(c => { c.shown = true; });
            closeModal();
            render();
            setTimeout(showResult, 900);
        }

        function showResult() {
            const r = S.result;
            const mine = caseByNum(S.player);
            let body;

            if (r.type === 'deal') {
                const diff = roundMoney(Math.abs(r.amount - mine.prize));
                const verdict = r.amount >= mine.prize
                    ? `You beat the banker by ${formatPrize(diff)}. 🎉`
                    : `Ouch, you left ${formatPrize(diff)} on the table.`;
                body = `
                    <h2>DEAL!</h2>
                    <p>You sold case #${mine.num} for</p>
                    <div class="big-amount">${formatPrize(r.amount)}</div>
                    <p>Your case held ${formatPrize(mine.prize)}.</p>
                    <p>${verdict}</p>`;
            } else {
                const verdict = r.amount >= r.losePrize
                    ? (r.type === 'swap' ? 'The swap paid off! 🎉' : 'Sticking with your case paid off! 🎉')
                    : `Case #${r.loseNum} had ${formatPrize(r.losePrize)}.`;
                body = `
                    <h2>NO DEAL!</h2>
                    <p>${r.type === 'swap' ? 'You swapped and opened' : 'You kept'} case #${r.winNum}. You win</p>
                    <div class="big-amount">${formatPrize(r.amount)}</div>
                    <p>${verdict}</p>`;
            }

            openModal(`${body}
                <div class="actions">
                    <button class="green" onclick="newGame()">Play again</button>
                    <button class="ghost" onclick="closeModal()">See the board</button>
                </div>`);
        }

        /* ---------- Modal ---------- */
        function openModal(html) {
            document.getElementById('modal').innerHTML = html;
            document.getElementById('overlay').classList.remove('hidden');
            const btn = document.querySelector('#modal button');
            if (btn) btn.focus();
        }
        function closeModal() {
            document.getElementById('overlay').classList.add('hidden');
        }

        newGame();
    </script>
</body>
</html>
