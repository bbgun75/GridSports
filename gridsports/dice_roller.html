<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Roller - Red & Blue</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #f0f0f0;
        }
        
        h1 {
            margin-bottom: 40px;
            color: #333;
        }
        
        .dice-container {
            display: flex;
            gap: 60px;
            margin-bottom: 40px;
        }
        
        .die {
            width: 150px;
            height: 150px;
            border: 4px solid #000;
            border-radius: 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 8px;
            padding: 15px;
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        
        .die:hover {
            transform: scale(1.05);
        }
        
        .die:active {
            transform: scale(0.95);
        }
        
        .red-die {
            background: #dc143c;
        }
        
        .blue-die {
            background: #1e90ff;
        }
        
        .dot {
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            margin: auto;
        }
        
        .empty {
            visibility: hidden;
        }
        
        .label {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
            font-size: 18px;
        }
        
        .red-label {
            color: #dc143c;
        }
        
        .blue-label {
            color: #1e90ff;
        }
        
        .dice-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .buttons {
            display: flex;
            gap: 20px;
        }
        
        button {
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border: 3px solid #000;
            border-radius: 10px;
            cursor: pointer;
            background: #fff;
            transition: all 0.2s;
        }
        
        button:hover {
            background: #333;
            color: white;
        }
        
        @keyframes roll {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(90deg); }
            50% { transform: rotate(180deg); }
            75% { transform: rotate(270deg); }
        }
        
        .rolling {
            animation: roll 0.5s ease-in-out;
        }
    </style>
</head>
<body>
    <h1>Roll the Dice</h1>
    
    <div class="dice-container">
        <div class="dice-group">
            <div class="die red-die" id="redDie" onclick="rollRed()">
                <div class="dot empty"></div>
                <div class="dot empty"></div>
                <div class="dot empty"></div>
                <div class="dot empty"></div>
                <div class="dot empty"></div>
                <div class="dot empty"></div>
                <div class="dot empty"></div>
                <div class="dot empty"></div>
                <div class="dot empty"></div>
            </div>
            <div class="label red-label">RED</div>
        </div>
        
        <div class="dice-group">
            <div class="die blue-die" id="blueDie" onclick="rollBlue()">
                <div class="dot empty"></div>
                <div class="dot empty"></div>
                <div class="dot empty"></div>
                <div class="dot empty"></div>
                <div class="dot empty"></div>
                <div class="dot empty"></div>
                <div class="dot empty"></div>
                <div class="dot empty"></div>
                <div class="dot empty"></div>
            </div>
            <div class="label blue-label">BLUE</div>
        </div>
    </div>
    
    <div class="buttons">
        <button onclick="rollBoth()">ROLL BOTH</button>
    </div>

    <script>
        function rollDie() {
            return Math.floor(Math.random() * 6) + 1;
        }
        
        function renderDots(value) {
            // Patterns for each die face (which dots are visible in 3x3 grid)
            const patterns = {
                1: [false, false, false, false, true, false, false, false, false],
                2: [true, false, false, false, false, false, false, false, true],
                3: [true, false, false, false, true, false, false, false, true],
                4: [true, false, true, false, false, false, true, false, true],
                5: [true, false, true, false, true, false, true, false, true],
                6: [true, false, true, true, false, true, true, false, true]
            };
            
            const pattern = patterns[value];
            let html = '';
            
            for (let i = 0; i < 9; i++) {
                if (pattern[i]) {
                    html += '<div class="dot"></div>';
                } else {
                    html += '<div class="dot empty"></div>';
                }
            }
            
            return html;
        }
        
        function rollRed() {
            const die = document.getElementById('redDie');
            die.classList.add('rolling');
            
            setTimeout(() => {
                const value = rollDie();
                die.innerHTML = renderDots(value);
                die.classList.remove('rolling');
            }, 500);
        }
        
        function rollBlue() {
            const die = document.getElementById('blueDie');
            die.classList.add('rolling');
            
            setTimeout(() => {
                const value = rollDie();
                die.innerHTML = renderDots(value);
                die.classList.remove('rolling');
            }, 500);
        }
        
        function rollBoth() {
            const redDie = document.getElementById('redDie');
            const blueDie = document.getElementById('blueDie');
            
            redDie.classList.add('rolling');
            blueDie.classList.add('rolling');
            
            setTimeout(() => {
                redDie.innerHTML = renderDots(rollDie());
                blueDie.innerHTML = renderDots(rollDie());
                
                redDie.classList.remove('rolling');
                blueDie.classList.remove('rolling');
            }, 500);
        }
    </script>
</body>
</html>
