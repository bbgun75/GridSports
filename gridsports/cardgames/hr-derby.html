<html lang="en">

    <style>
        @page {
            size: 3in 5in;
            margin: 0;
        }
        
        @media print {
            .no-print { display: none; }
            .page-break { page-break-after: always; }
            body { margin: 0; padding: 0; }
            .card {
                transform: rotate(90deg);
                transform-origin: top left;
                position: relative;
                left: 3in;
            }
        }
        
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            font-size: 11px;
        }
        
        .controls {
            text-align: center;
            padding: 20px;
            background: #FFF;
            border: 3px solid #000;
            margin-bottom: 20px;
            color: #000;
        }
        
        .controls h2 {
            margin-top: 0;
            color: #000;
        }
        
        .controls select {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid #000;
            background: #fff;
            margin: 10px;
        }
        
        .controls button {
            padding: 15px 30px;
            margin: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid #000;
            background: #fff;
        }
        
        .controls button:hover {
            background: #E8E8E8;
            color: #000;
        }
        
        .card {
            width: 3in;
            height: 5in;
            border: 3px solid #000;
            padding: 0.12in;
            background: white;
            margin: 0 auto 20px auto;
            box-sizing: border-box;
            position: relative;
        }
        
        .card h1 {
            text-align: center;
            margin: 0 0 2px 0;
            font-size: 14px;
            color: #000;
            font-weight: bold;
        }
        
        .ballpark-header {
            text-align: center;
            margin: 0 0 3px 0;
            padding: 5px;
            border: 2px solid #000;
            font-weight: bold;
            font-size: 12px;
        }
        
        .ballpark-info {
            text-align: center;
            margin: 0 0 4px 0;
            padding: 2px;
            font-size: 7px;
            border: 1px solid #666;
            background: #f5f5f5;
        }
        
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 0.1in;
        }
        
        .grid-section {
            border: 2px solid #000;
            padding: 5px;
            background: #FCFCFC;
        }
        
        .grid-section h3 {
            margin: 0 0 4px 0;
            font-size: 9px;
            text-align: center;
            font-weight: bold;
        }
        
        .grid-label-row {
            display: flex;
            justify-content: center;
            gap: 0;
            margin-bottom: 1px;
            font-size: 6px;
            font-weight: bold;
            color: #666;
        }
        
        .grid-label-row span {
            display: inline-block;
            text-align: center;
        }
        
        .grid {
            display: grid;
            grid-template-columns: 18px repeat(6, 30px);
            grid-template-rows: 18px repeat(6, 30px);
            gap: 1px;
            background: #333;
            margin: 0 auto;
            width: fit-content;
        }
        
        .cell {
            background: #90EE90;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            border: 1px solid #666;
        }
        
        .label {
            background: #333;
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .grass { background: #F0F0F0; border: 1px solid #999; }
        .hr { background: #FFB6C1; color: #000; font-size: 9px; font-weight: bold; }
        .long-hr { background: #FFEB99; color: #000; font-size: 8px; font-weight: bold; }
        .wind-help { background: #D4E6F1; color: #000; }
        .wind-hurt { background: #E8E8E8; color: #000; }
        
        .legend {
            margin-top: 3px;
            font-size: 6px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1px;
            line-height: 1.3;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 2px;
        }
        
        .legend-box {
            width: 7px;
            height: 7px;
            border: 1px solid #000;
            flex-shrink: 0;
        }
        
        .right-section {
            display: flex;
            flex-direction: column;
            gap: 0.08in;
        }
        
        .rules-box {
            border: 2px solid #000;
            padding: 5px;
            font-size: 7px;
            line-height: 1.4;
            background: #fff8dc;
        }
        
        .rules-box h3 {
            margin: 0 0 3px 0;
            font-size: 9px;
            text-align: center;
            font-weight: bold;
            color: #1a1a2e;
        }
        
        .scorecard {
            border: 2px solid #000;
            padding: 4px;
            flex: 1;
            background: #FCFCFC;
        }
        
        .scorecard h3 {
            margin: 0 0 3px 0;
            font-size: 9px;
            font-weight: bold;
            text-align: center;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 8px;
        }
        
        th, td {
            border: 1px solid #000;
            padding: 2px;
            text-align: center;
        }
        
        th {
            background: #E8E8E8;
            color: #000;
            font-weight: bold;
        }
        
        .round-header {
            background: #F0F0F0;
            color: #000;
            font-weight: bold;
        }
        
        .total-row {
            background: #FFEB99;
            font-weight: bold;
            color: #000;
        }
    </style>
</head>

        function getTextColor(bgColor) {
            const r = parseInt(bgColor.substr(1,2), 16);
            const g = parseInt(bgColor.substr(3,2), 16);
            const b = parseInt(bgColor.substr(5,2), 16);
            const brightness = (r * 299 + g * 587 + b * 114) / 1000;
            return brightness > 128 ? '#000000' : '#FFFFFF';
        }
        
        function renderBallparkCard(parkKey) {
            const park = ballparks[parkKey];
            const colors = teamColors[parkKey] || { primary: '#FFFFFF', secondary: '#000000' };
            const grid = park.grid;
            const textColor = getTextColor(colors.primary);
            
            let html = `
            <div class="card page-break">
                <h1>HOME RUN DERBY</h1>
                
                <div class="ballpark-header" style="background: ${colors.primary}; color: ${textColor}; border-color: ${colors.secondary};">
                    ${park.name}
                </div>
                
                <div class="ballpark-info">
                    ${park.city} • ${park.features}
                </div>
                
                <div class="main-content">
                    <div class="grid-section">
                        <h3>SWING GRID (Roll 2d6) — LF ← → RF</h3>
                        <div class="grid">`;
            
            // Column headers
            html += '<div class="label"></div>';
            for (let col = 1; col <= 6; col++) {
                html += `<div class="label">${col}</div>`;
            }
            
            // Row labels with depth indication
            const rowLabels = ['1', '2', '3', '4', '5', '6'];
            
            grid.forEach((row, rowIndex) => {
                html += `<div class="label">${rowLabels[rowIndex]}</div>`;
                row.forEach(cell => {
                    let className = 'cell';
                    let content = '';
                    
                    if (cell === 'grass') className += ' grass';
                    else if (cell === 'hr') { className += ' hr'; content = 'HR'; }
                    else if (cell === 'long-hr') { className += ' long-hr'; content = 'LONG'; }
                    else if (cell === 'wind-help') { className += ' wind-help'; content = '+'; }
                    else if (cell === 'wind-hurt') { className += ' wind-hurt'; content = '-'; }
                    
                    html += `<div class="${className}">${content}</div>`;
                });
            });
            
            html += `
                        </div>
                        <div class="legend">
                            <div class="legend-item"><span class="legend-box" style="background: #FFB6C1; border: 1px solid #000;"></span>HR = Home Run</div>
                            <div class="legend-item"><span class="legend-box" style="background: #FFEB99; border: 1px solid #000;"></span>LONG = Crushed! HR</div>
                            <div class="legend-item"><span class="legend-box" style="background: #D4E6F1; border: 1px solid #000;"></span>+ Wind = HR</div>
                            <div class="legend-item"><span class="legend-box" style="background: #E8E8E8; border: 1px solid #000;"></span>- Wind = Out</div>
                            <div class="legend-item"><span class="legend-box" style="background: #F0F0F0; border: 1px solid #000;"></span>Grass = Out</div>
                        </div>
                    </div>
                    
                    
                    <div class="scorecard">
                        <h3>SCORECARD</h3>
                            <table>
                                <tr>
                                    <th>Round</th>
                                    <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th>
                                    <th>6</th><th>7</th><th>8</th><th>9</th><th style="background: #ccc; color: #000;">10⭐</th>
                                    <th>Total</th>
                                </tr>
                                <tr>
                                    <td class="round-header">R1</td>
                                    <td>☐</td><td>☐</td><td>☐</td><td>☐</td><td>☐</td>
                                    <td>☐</td><td>☐</td><td>☐</td><td>☐</td><td style="background: #FFEB99;">☐</td>
                                    <td>&nbsp;</td>
                                </tr>
                                <tr>
                                    <td class="round-header">R2</td>
                                    <td>☐</td><td>☐</td><td>☐</td><td>☐</td><td>☐</td>
                                    <td>☐</td><td>☐</td><td>☐</td><td>☐</td><td style="background: #FFEB99;">☐</td>
                                    <td>&nbsp;</td>
                                </tr>
                                <tr>
                                    <td class="round-header">R3</td>
                                    <td>☐</td><td>☐</td><td>☐</td><td>☐</td><td>☐</td>
                                    <td>☐</td><td>☐</td><td>☐</td><td>☐</td><td style="background: #FFEB99;">☐</td>
                                    <td>&nbsp;</td>
                                </tr>
                                <tr>
                                    <td colspan="12" class="total-row">GRAND TOTAL: _______</td>
                                </tr>
                            </table>
                            <div style="text-align: center; font-size: 7px; margin-top: 4px;">
                                Check ☑ for HR, leave ☐ for out. Golden ball ⭐ = 2pts
                            </div>
                        </div>
                    </div>
                </div>
            </div>`;
            
            return html;
        }
        
        function loadSelected() {
            const sel = document.getElementById('ballparkSelect');
            const container = document.getElementById('cardsContainer');
            container.innerHTML = renderBallparkCard(sel.value);
        }
        
        window.onload = function() {
            const sel = document.getElementById('ballparkSelect');
            const sortedKeys = Object.keys(ballparks).sort((a, b) => 
                ballparks[a].name.localeCompare(ballparks[b].name)
            );
            sortedKeys.forEach(key => {
                const opt = document.createElement('option');
                opt.value = key;
                opt.textContent = ballparks[key].name;
                sel.appendChild(opt);
            });
            loadSelected();
        };
    </script>
