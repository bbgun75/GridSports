<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid Hockey – NHL 2025-26</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;600&display=swap');

/* Portrait index card: 3in × 5in */
@page { size: 3in 5in; margin: 0; }

@media print {
  html, body { margin: 0; padding: 0; background: white; }
  .no-print { display: none !important; }
  .card-wrap { width: auto !important; height: auto !important; }
  .card-page { transform: none !important; page-break-after: always; break-after: page; }
  .card-page:last-of-type { page-break-after: avoid; break-after: avoid; }
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #080e1c; font-family: 'Barlow Condensed', sans-serif; }

.no-print {
  background: #080e1c; padding: 20px; text-align: center;
  border-bottom: 2px solid #4fc3f7;
}
.no-print h1 { font-family: 'Anton', sans-serif; font-size: 1.9rem; color: #4fc3f7; letter-spacing: 4px; }
.no-print p { color: #78909c; font-size: 0.85rem; margin-top: 4px; }
.print-btn {
  margin-top: 12px; padding: 10px 28px; background: #4fc3f7;
  color: #080e1c; border: none; font-family: 'Anton', sans-serif;
  font-size: 1rem; letter-spacing: 2px; cursor: pointer; border-radius: 2px;
}

#preview {
  background: #0d1625; padding: 20px;
  display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
}

/* Scale factor for screen */
.card-wrap {
  display: inline-block;
  width:  calc(3in * 0.68);
  height: calc(5in * 0.68);
  flex-shrink: 0;
}

/* ── CARD: 3in wide × 5in tall portrait ── */
.card-page {
  width: 3in; height: 5in;
  background: #fff;
  display: flex; flex-direction: column;
  font-family: 'Barlow Condensed', sans-serif;
  overflow: hidden; flex-shrink: 0;
  box-shadow: 0 6px 24px rgba(0,0,0,0.55);
  transform: scale(0.68); transform-origin: top left;
  --accent: #1565c0;
}

/* ── HEADER BAND ── */
.card-header {
  background: var(--accent);
  padding: 0.09in 0.1in 0.07in;
  display: flex; justify-content: space-between; align-items: flex-start;
  flex-shrink: 0;
}
.hdr-left { display: flex; flex-direction: column; }
.game-label { font-family: 'Barlow', sans-serif; font-size: 5.5pt; color: rgba(255,255,255,0.5); letter-spacing: 2px; font-weight: 600; }
.team-name-big { font-family: 'Anton', sans-serif; font-size: 17pt; color: #fff; letter-spacing: 1px; line-height: 1; margin-top: 1px; }
.team-city-sm { font-size: 6pt; color: rgba(255,255,255,0.6); letter-spacing: 0.5px; margin-top: 2px; }
.hdr-right { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; padding-top: 2px; }
.team-flag { font-size: 20pt; line-height: 1; }
.team-num { font-family: 'Barlow', sans-serif; font-size: 6pt; color: rgba(255,255,255,0.35); font-weight: 600; letter-spacing: 1px; }

/* ── STAT ROW ── */
.stat-row {
  display: flex; border-bottom: 1.5px solid var(--accent);
  background: #f4f7fb; flex-shrink: 0;
}
.stat-cell {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 0.042in 0.03in;
  border-right: 1px solid #dde4ee;
}
.stat-cell:last-child { border-right: none; }
.stat-label { font-size: 4.5pt; color: #999; letter-spacing: 1px; text-transform: uppercase; font-family: 'Barlow', sans-serif; font-weight: 600; }
.stat-value { font-family: 'Anton', sans-serif; font-size: 10pt; color: var(--accent); letter-spacing: 0.5px; line-height: 1.1; }
.stat-sub { font-size: 4pt; color: #bbb; font-family: 'Barlow', sans-serif; }

/* ── GRID SECTION ── */
.grid-section {
  flex: 1; display: flex; flex-direction: column;
  padding: 0.065in 0.08in 0.045in;
}
.grid-title-row {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.038in;
}
.grid-title { font-family: 'Anton', sans-serif; font-size: 7pt; color: var(--accent); letter-spacing: 1.5px; }
.grid-hint { font-size: 4.5pt; color: #bbb; font-family: 'Barlow', sans-serif; }

.dice-grid {
  display: grid;
  grid-template-columns: 0.13in repeat(6, 1fr);
  grid-template-rows: 0.13in repeat(6, 1fr);
  flex: 1; gap: 1.2px;
}
.grid-corner { background: #fff; }
.grid-col-head { background: #c62828; display: flex; align-items: center; justify-content: center; font-family: 'Anton', sans-serif; font-size: 5.5pt; color: white; border-radius: 1px; }
.grid-row-head { background: #1565c0; display: flex; align-items: center; justify-content: center; font-family: 'Anton', sans-serif; font-size: 5.5pt; color: white; border-radius: 1px; }
.grid-cell { display: flex; flex-direction: column; align-items: center; justify-content: center; border: 0.75px solid #e0e0e0; border-radius: 1px; line-height: 1; }

.cell-goal  { background: #dbeafe; border-color: #1d4ed8; }
.cell-save  { background: #fee2e2; border-color: #dc2626; }
.cell-block { background: #dcfce7; border-color: #16a34a; }
.cell-post  { background: #fef9c3; border-color: #ca8a04; }
.cell-wide  { background: #f5f5f5; border-color: #bdbdbd; }

.cell-type { font-family: 'Anton', sans-serif; font-size: 4.5pt; }
.cell-val  { font-size: 3.5pt; color: #777; font-family: 'Barlow', sans-serif; }

.legend-row { display: flex; gap: 0.04in; flex-wrap: wrap; margin-top: 0.038in; align-items: center; }
.legend-item { display: flex; align-items: center; gap: 2px; font-size: 4pt; color: #666; font-family: 'Barlow', sans-serif; }
.legend-dot { width: 6px; height: 6px; border-radius: 1px; flex-shrink: 0; }

/* ── RESULT BAND ── */
.result-band {
  display: flex; border-top: 1.5px solid var(--accent);
  background: #fafbfd; flex-shrink: 0;
}
.result-item {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 0.034in 0.02in;
  border-right: 1px solid #e8edf2;
}
.result-item:last-child { border-right: none; }
.result-icon { font-size: 6.5pt; line-height: 1; }
.result-label { font-family: 'Anton', sans-serif; font-size: 5.5pt; letter-spacing: 0.5px; }
.result-pts { font-size: 4pt; color: #aaa; font-family: 'Barlow', sans-serif; }
.r-win  { color: #1565c0; }
.r-ot   { color: #b45309; }
.r-loss { color: #c62828; }

/* ── WRITE LINE ── */
.write-line {
  display: flex; gap: 0.05in; padding: 0.038in 0.08in 0.045in;
  border-top: 1px solid #eee; flex-shrink: 0;
}
.write-field { flex: 1; border-bottom: 0.75px solid #ccc; font-size: 4pt; color: #ccc; padding-bottom: 1px; font-family: 'Barlow', sans-serif; }

/* ══ INSTRUCTIONS ══ */
.inst-page { background: #050c1a !important; display: flex; flex-direction: column; }
.inst-top {
  background: #0d2240; padding: 0.11in 0.1in 0.09in;
  display: flex; flex-direction: column; align-items: center;
  text-align: center; border-bottom: 3px solid #4fc3f7; flex-shrink: 0;
}
.inst-game-label { font-family: 'Barlow', sans-serif; font-size: 6pt; color: #81d4fa; letter-spacing: 3px; font-weight: 600; }
.inst-title { font-family: 'Anton', sans-serif; font-size: 22pt; color: white; letter-spacing: 2px; line-height: 0.95; margin-top: 2px; }
.inst-season { font-family: 'Anton', sans-serif; font-size: 9pt; color: rgba(255,255,255,0.3); letter-spacing: 3px; margin-top: 1px; }
.inst-puck { font-size: 20pt; margin: 0.04in 0 0.04in; }
.inst-dice-row { display: flex; gap: 0.1in; }
.inst-die { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.die-box { width: 0.26in; height: 0.26in; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 10pt; color: white; font-family: 'Anton', sans-serif; }
.die-red  { background: #c62828; }
.die-blue { background: #1565c0; }
.die-label { font-size: 4.5pt; color: #81d4fa; font-family: 'Barlow', sans-serif; font-weight: 600; letter-spacing: 0.5px; }

.inst-body { flex: 1; padding: 0.09in 0.1in; display: flex; flex-direction: column; gap: 0.045in; }
.inst-section { font-family: 'Anton', sans-serif; font-size: 7pt; color: #4fc3f7; letter-spacing: 2px; margin-bottom: 1px; }
.inst-step { display: flex; gap: 5px; align-items: flex-start; }
.inst-num { font-family: 'Anton', sans-serif; font-size: 9pt; color: #4fc3f7; line-height: 1; flex-shrink: 0; width: 10px; }
.inst-text { font-size: 5.5pt; color: #cfd8dc; line-height: 1.4; font-family: 'Barlow', sans-serif; }
.inst-divider { border: none; border-top: 1px solid rgba(79,195,247,0.15); }

.inst-results { display: flex; gap: 0.04in; }
.inst-res-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.inst-res-icon { font-size: 8pt; }
.inst-res-label { font-family: 'Anton', sans-serif; font-size: 6pt; }
.inst-res-detail { font-size: 4.5pt; color: #90a4ae; font-family: 'Barlow', sans-serif; text-align: center; line-height: 1.3; }

.inst-tiers { display: flex; flex-direction: column; gap: 2px; }
.inst-tier-row { display: flex; align-items: center; gap: 4px; }
.inst-tier-badge { font-family: 'Anton', sans-serif; font-size: 6pt; padding: 1px 4px; border-radius: 1px; color: white; flex-shrink: 0; }
.inst-tier-desc { font-size: 4.5pt; color: #90a4ae; font-family: 'Barlow', sans-serif; line-height: 1.35; }

.inst-footer { font-size: 4pt; color: #37474f; font-family: 'Barlow', sans-serif; border-top: 1px solid rgba(255,255,255,0.06); padding: 0.035in 0.1in; text-align: center; flex-shrink: 0; }

/* ══ TALLY ══ */
.tally-page { background: white !important; display: flex; flex-direction: column; padding: 0.08in 0.09in; }
.tally-hdr { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #1565c0; padding-bottom: 0.03in; margin-bottom: 0.02in; }
.tally-game { font-family: 'Anton', sans-serif; font-size: 11pt; color: #1565c0; letter-spacing: 2px; }
.tally-sub { font-size: 5pt; color: #90a4ae; letter-spacing: 1px; }
.tally-body { flex: 1; display: flex; flex-direction: column; gap: 1px; }
.tally-row { display: flex; align-items: center; border-bottom: 0.5px solid #f5f5f5; padding: 0.8px 0; }
.t-num { font-family: 'Anton', sans-serif; font-size: 5pt; color: #ddd; width: 0.12in; flex-shrink: 0; }
.t-flag { font-size: 7.5pt; width: 0.15in; flex-shrink: 0; line-height: 1; }
.t-name { flex: 1; font-size: 5pt; color: #222; font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase; font-family: 'Barlow Condensed', sans-serif; }
.t-boxes { display: flex; gap: 1.5px; width: 0.72in; flex-shrink: 0; }
.t-box { flex: 1; height: 9px; border: 0.5px solid #ddd; border-radius: 1px; display: flex; align-items: center; justify-content: center; font-size: 3pt; font-weight: 700; letter-spacing: 0.2px; }
.tw { border-color: #1565c0; color: #1565c0; }
.tot { border-color: #b45309; color: #b45309; }
.tl { border-color: #c62828; color: #c62828; }
.tp { border-color: #16a34a; color: #16a34a; }
.t-gf { width: 0.2in; height: 9px; border-bottom: 0.5px solid #ddd; flex-shrink: 0; margin-left: 2px; }
.tally-footer { display: flex; align-items: center; gap: 6px; border-top: 1.5px solid #1565c0; padding-top: 0.03in; margin-top: 0.025in; }
.tally-tot-label { font-family: 'Anton', sans-serif; font-size: 7pt; color: #1565c0; letter-spacing: 1px; flex: 1; }
.tally-tot-box { width: 0.4in; height: 12px; border: 1.5px solid #1565c0; border-radius: 2px; }
.tally-tot-note { font-size: 3.5pt; color: #aaa; font-family: 'Barlow', sans-serif; }
</style>
</head>

function cellClass(t){
  if(t==='G')  return 'grid-cell cell-goal';
  if(t==='SV') return 'grid-cell cell-save';
  if(t==='BL') return 'grid-cell cell-block';
  if(t==='PT') return 'grid-cell cell-post';
  return 'grid-cell cell-wide';
}
function cellLabel(t){
  if(t==='G')  return ['GOAL','🏒'];
  if(t==='SV') return ['SAVE','✗'];
  if(t==='BL') return ['BLOK','✗'];
  if(t==='PT') return ['POST','—'];
  return ['WIDE','—'];
}
function tierColor(t){
  return {A:'#c62828',B:'#1565c0',C:'#16a34a',D:'#78350f'}[t]||'#555';
}

function renderCard(t){
  let gridHTML = '<div class="grid-corner"></div>';
  for(let c=1;c<=6;c++) gridHTML+=`<div class="grid-col-head">${c}</div>`;
  for(let r=0;r<6;r++){
    gridHTML+=`<div class="grid-row-head">${r+1}</div>`;
    for(let c=0;c<6;c++){
      const cell=t.grid[r][c];
      const [lbl,val]=cellLabel(cell);
      gridHTML+=`<div class="${cellClass(cell)}"><span class="cell-type">${lbl}</span><span class="cell-val">${val}</span></div>`;
    }
  }
  return `
<div class="card-wrap"><div class="card-page" style="--accent:${t.accent}">
  <div class="card-header">
    <div class="hdr-left">
      <span class="game-label">GRID HOCKEY · NHL 2025–26</span>
      <span class="team-name-big">${t.name}</span>
      <span class="team-city-sm">${t.city} &middot; ${t.conf}</span>
    </div>
    <div class="hdr-right">
      <span class="team-flag">${t.flag}</span>
      <span class="team-num">#${t.num}</span>
    </div>
  </div>
  <div class="stat-row">
    <div class="stat-cell">
      <span class="stat-label">Shots</span>
      <span class="stat-value">${t.shot_range}</span>
      <span class="stat-sub">1d12 + ${t.shot_base}</span>
    </div>
    <div class="stat-cell">
      <span class="stat-label">Tier</span>
      <span class="stat-value" style="color:${tierColor(t.tier)}">${t.tier}</span>
      <span class="stat-sub">offense</span>
    </div>
    <div class="stat-cell">
      <span class="stat-label">🔴 Die</span>
      <span class="stat-value" style="color:#c62828;font-size:8pt">COL</span>
      <span class="stat-sub">column →</span>
    </div>
    <div class="stat-cell">
      <span class="stat-label">🔵 Die</span>
      <span class="stat-value" style="color:#1565c0;font-size:8pt">ROW</span>
      <span class="stat-sub">row ↓</span>
    </div>
  </div>
  <div class="grid-section">
    <div class="grid-title-row">
      <span class="grid-title">SHOT CHART</span>
      <span class="grid-hint">most goals wins · tie = OT</span>
    </div>
    <div class="dice-grid">${gridHTML}</div>
    <div class="legend-row">
      <div class="legend-item"><div class="legend-dot" style="background:#dbeafe;border:1px solid #1d4ed8"></div>GOAL</div>
      <div class="legend-item"><div class="legend-dot" style="background:#fee2e2;border:1px solid #dc2626"></div>SAVE</div>
      <div class="legend-item"><div class="legend-dot" style="background:#dcfce7;border:1px solid #16a34a"></div>BLOCK</div>
      <div class="legend-item"><div class="legend-dot" style="background:#fef9c3;border:1px solid #ca8a04"></div>POST</div>
      <div class="legend-item"><div class="legend-dot" style="background:#f5f5f5;border:1px solid #bdbdbd"></div>WIDE</div>
    </div>
  </div>
  <div class="result-band">
    <div class="result-item">
      <span class="result-icon">🔵</span>
      <span class="result-label r-win">WIN</span>
      <span class="result-pts">more goals · 2 pts</span>
    </div>
    <div class="result-item">
      <span class="result-icon">🟡</span>
      <span class="result-label r-ot">OT WIN</span>
      <span class="result-pts">tied → coin · 1 pt</span>
    </div>
    <div class="result-item">
      <span class="result-icon">🔴</span>
      <span class="result-label r-loss">LOSS</span>
      <span class="result-pts">fewer goals · 0 pts</span>
    </div>
  </div>
  <div class="write-line">
    <div class="write-field">Player ___________</div>
    <div class="write-field">Shots ____</div>
    <div class="write-field">Goals ____</div>
  </div>
</div></div>`;
}

    <div class="inst-section">RESULT</div>
    <div class="inst-results">

      <div class="inst-res-item"><span class="inst-res-icon">🟡</span><span class="inst-res-label r-ot">OT WIN</span><span class="inst-res-detail">tied · coin<br>1 pt</span></div>
      <div class="inst-res-item"><span class="inst-res-icon">🔴</span><span class="inst-res-label r-loss">LOSS</span><span class="inst-res-detail">fewer goals<br>0 pts</span></div>

      <div class="inst-tier-row"><div class="inst-tier-badge" style="background:#16a34a">C</div><div class="inst-tier-desc">OTT · TOR · FLA · CBJ · PHI · NSH · CHI · STL · CGY · SEA — shots 17–28</div></div>
      <div class="inst-tier-row"><div class="inst-tier-badge" style="background:#78350f">D</div><div class="inst-tier-desc">NJ · NYR · ANA · SJS — shots 13–24</div></div>
    </div>
  </div>
  <div class="inst-footer">32 teams · tiers from actual 2025-26 GF/G & standings data · March 2026</div>
</div></div>`;
}

function renderTally(){
  const rows = teams.map(t=>`
    <div class="tally-row">
      <div class="t-num">${t.num}</div>
      <div class="t-flag">${t.flag}</div>
      <div class="t-name">${t.name}</div>
      <div class="t-boxes">
        <div class="t-box tw">W</div>
        <div class="t-box tot">OT</div>
        <div class="t-box tl">L</div>
        <div class="t-box tp">PTS</div>
      </div>
      <div class="t-gf"></div>
    </div>`).join('');
  return `
<div class="card-wrap"><div class="card-page tally-page">
  <div class="tally-hdr">
    <div>
      <div class="tally-game">Grid Hockey</div>
      <div class="tally-sub">NHL 2025–26 · Match Tally</div>
    </div>
    <div style="font-size:4pt;color:#90a4ae;text-align:right">W / OT / L / PTS<br>GF →</div>
  </div>
  <div class="tally-body">${rows}</div>
  <div class="tally-footer">
    <div class="tally-tot-label">Total Points</div>
    <div class="tally-tot-box"></div>
    <div class="tally-tot-note">2 win · 1 OT win · 0 loss</div>
  </div>
</div></div>`;
}

const preview = document.getElementById('preview');
preview.insertAdjacentHTML('beforeend', renderInstructions());
teams.forEach(t => preview.insertAdjacentHTML('beforeend', renderCard(t)));
preview.insertAdjacentHTML('beforeend', renderTally());
</script>
