<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GRID COLLEGE FOOTBALL</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--gr:#1a5c2a;--gd:#c9a227;--dk:#0f2217;--md:#e8f0ea;--rd:#b22222;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Barlow',sans-serif;background:#d9e4db;padding:.3in;}
.no-print{text-align:center;margin-bottom:.3in;padding:.2in;background:var(--dk);border-radius:6px;color:white;}
.no-print h1{font-family:'Bebas Neue',sans-serif;font-size:42pt;color:var(--gd);letter-spacing:6px;line-height:1;}
.no-print .sub{font-family:'Barlow Condensed',sans-serif;font-size:11pt;color:#aaa;letter-spacing:3px;margin-top:4px;}
.no-print .tag{font-family:'Barlow Condensed',sans-serif;font-size:9pt;color:#ccc;letter-spacing:2px;margin-top:5px;}
.btn-print{margin-top:12px;padding:8px 28px;background:var(--gd);color:var(--dk);border:none;font-family:'Bebas Neue',sans-serif;font-size:14pt;letter-spacing:3px;border-radius:3px;cursor:pointer;}
.wrap{display:flex;flex-wrap:wrap;gap:.18in;}
.card,.instr-card,.tally-card{width:3.5in;background:white;border:1px solid #bbb;border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.12);display:flex;flex-direction:column;overflow:hidden;page-break-inside:avoid;}
.tally-card{width:7.18in;}
.ch{background:var(--gr);color:white;padding:.05in .1in .04in;display:flex;justify-content:space-between;align-items:flex-end;}
.ch-left .num{font-family:'Bebas Neue',sans-serif;font-size:7pt;color:rgba(255,255,255,.45);letter-spacing:2px;}
.ch-left .name{font-family:'Bebas Neue',sans-serif;font-size:17pt;letter-spacing:2px;line-height:1;}
.ch-left .region{font-family:'Barlow Condensed',sans-serif;font-size:6.5pt;color:rgba(255,255,255,.6);letter-spacing:2px;}
.ch-right{text-align:right;}
.conf{font-family:'Barlow Condensed',sans-serif;font-size:6pt;background:var(--gd);color:var(--dk);padding:1px 5px;border-radius:2px;letter-spacing:1px;}
.rec{font-family:'Barlow Condensed',sans-serif;font-size:6pt;color:rgba(255,255,255,.55);letter-spacing:1px;margin-top:3px;}
.cb{flex:1;display:flex;padding:.06in .08in .04in;}
.gs{flex:1;}
.gl{font-family:'Bebas Neue',sans-serif;font-size:5.5pt;color:var(--gr);letter-spacing:2px;margin-bottom:2px;}
.dg{display:grid;grid-template-columns:auto repeat(6,1fr);gap:1.5px;}
.ax{display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:7pt;color:#888;width:.14in;}
.ch2{text-align:center;font-family:'Bebas Neue',sans-serif;font-size:7pt;color:#888;padding-bottom:1px;}
.gc{width:100%;aspect-ratio:1.5/1;display:flex;align-items:center;justify-content:center;border-radius:1.5px;font-family:'Bebas Neue',sans-serif;font-size:5.5pt;text-align:center;padding:1px;}
.TD{background:#1a5c2a;color:white;}
.FG{background:#BA7517;color:#412402;}
.D1{background:#E6F1FB;color:#0C447C;border:1px solid #85B7EB;}
.PUN{background:#F1EFE8;color:#5F5E5A;border:1px solid #D3D1C7;}
.TUV{background:#A32D2D;color:white;}
.sp{width:.85in;padding-left:.07in;display:flex;flex-direction:column;gap:4px;}
.st{font-family:'Bebas Neue',sans-serif;font-size:6pt;color:var(--gr);letter-spacing:2px;border-bottom:1px solid var(--gr);padding-bottom:1px;margin-bottom:2px;}
.sr{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;}
.sl2{font-family:'Barlow Condensed',sans-serif;font-size:6pt;color:#555;letter-spacing:1px;}
.sv2{font-family:'Bebas Neue',sans-serif;font-size:8pt;color:var(--dk);}
.sg{font-family:'Bebas Neue',sans-serif;font-size:9pt;padding:0 3px;border-radius:2px;background:var(--gr);color:white;}
.sg.b{background:#3a7a4c;}.sg.c{background:#856404;}.sg.d{background:var(--rd);}
.ri{font-family:'Barlow Condensed',sans-serif;font-size:5pt;color:#555;margin-bottom:1px;}
.ri strong{font-family:'Bebas Neue',sans-serif;font-size:6.5pt;color:var(--gr);}
.dt{margin-top:3px;}
.dr{display:flex;gap:2px;flex-wrap:wrap;}
.db{width:.135in;height:.135in;border:1px solid #85B7EB;border-radius:1px;background:#E6F1FB;}

.h2h-vs{font-family:'Bebas Neue',sans-serif;font-size:9pt;color:#aaa;text-align:center;display:block;margin-bottom:3px;}
.h2h-final{display:flex;align-items:center;gap:5px;margin-top:4px;padding-top:3px;border-top:1px dashed #ccc;}

.ls{background:var(--dk);padding:.025in .08in;display:flex;gap:5px;flex-wrap:wrap;align-items:center;}

.ld{width:7px;height:7px;border-radius:1px;flex-shrink:0;}

.ib ul{padding-left:8px;}.ib li{margin-bottom:2px;}

.tt{font-family:'Bebas Neue',sans-serif;font-size:16pt;color:var(--gd);letter-spacing:4px;}
.ts{font-family:'Barlow Condensed',sans-serif;font-size:7pt;color:rgba(255,255,255,.5);letter-spacing:2px;}
.tb{padding:.05in .1in;flex:1;}
.tc{display:grid;grid-template-columns:repeat(2,1fr);gap:.08in;}
.tct{font-family:'Bebas Neue',sans-serif;font-size:7pt;color:var(--gr);letter-spacing:2px;margin-bottom:3px;border-bottom:1px solid var(--gr);padding-bottom:1px;}
.tr2{display:flex;align-items:center;gap:5px;margin-bottom:2.5px;}
.tn2{font-family:'Bebas Neue',sans-serif;font-size:8pt;color:#aaa;width:.14in;flex-shrink:0;}
.tnm{font-family:'Barlow Condensed',sans-serif;font-size:7pt;color:var(--dk);font-weight:600;letter-spacing:.5px;flex:1;}
.tsb{width:.22in;height:.15in;border:1px solid #ccc;border-radius:1px;background:white;flex-shrink:0;}
.tpb{width:.18in;height:.15in;border:1px solid var(--gr);border-radius:1px;background:#e8f0ea;flex-shrink:0;}
.tf{background:var(--md);padding:.04in .12in;display:flex;justify-content:space-between;align-items:center;}
.tpk{display:flex;gap:8px;flex-wrap:wrap;}
.tpi{font-family:'Barlow Condensed',sans-serif;font-size:5.5pt;color:#555;}
.tpi strong{font-family:'Bebas Neue',sans-serif;font-size:7.5pt;color:var(--gr);}
.ttot{display:flex;align-items:center;gap:6px;}
.tl{font-family:'Bebas Neue',sans-serif;font-size:8pt;color:#777;letter-spacing:2px;}

@media print{@page{size:8.5in 11in;margin:.4in;}body{background:white !important;padding:0;}.no-print{display:none !important;}.wrap{gap:.18in;padding:0;}.card,.instr-card,.tally-card{box-shadow:none;border-color:#ccc;}}

<script>
const DISP={TD:'TD',FG:'FG',D1:'1ST',PUN:'PUNT',TUV:'TUV'};
const LEGEND=[
  {cls:'TD',label:'TD · 7 PTS'},{cls:'FG',label:'FG · 3 PTS'},
  {cls:'D1',label:'1ST DOWN · RE-ROLL'},
  {cls:'PUN',label:'PUNT · END DRIVE'},
  {cls:'TUV',label:'TURNOVER · END DRIVE'},
];

function mkGrid(td,fg,d1,pun,tuv){
  let g=[];
  for(let i=0;i<td;i++)g.push('TD');
  for(let i=0;i<fg;i++)g.push('FG');
  for(let i=0;i<d1;i++)g.push('D1');
  for(let i=0;i<pun;i++)g.push('PUN');
  for(let i=0;i<tuv;i++)g.push('TUV');
  while(g.length<36)g.push('PUN');
  return g;
}
function shuffle(arr,seed){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=(seed*9301+i*49297+233)%a.length;
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// Calibrated & verified:

// B: 6TD 7FG 10D1 12PUN 1TUV → ~29 pts/12 drives

const bB=mkGrid(6,7,10,12,1);

// Result tables calibrated for 12-drive scoring
const RT={
  A:[{l:'BLOWOUT W',r:'49+',p:30},{l:'WIN',r:'42-48',p:25},{l:'CLOSE W',r:'35-41',p:20},{l:'OT WIN',r:'28-34',p:15},{l:'OT LOSS',r:'21-27',p:10},{l:'LOSS',r:'0-20',p:0}],

function gc(g){return g==='A'?'':g==='B'?'b':g==='C'?'c':'d';}
function rkStr(r,rec){return r>0?'#'+r+' AP &middot; '+rec:rec;}

function buildGrid(cells){
  let h='<div class="dg"><div class="ax" style="height:.15in"></div>';
  for(let c=1;c<=6;c++)h+='<div class="ch2">'+c+'</div>';
  for(let r=0;r<6;r++){
    h+='<div class="ax">'+(r+1)+'</div>';
    for(let c=0;c<6;c++){const t=cells[r*6+c];h+='<div class="gc '+t+'">'+DISP[t]+'</div>';}
  }
  return h+'</div>';
}
function buildLegend(){
  return '<div class="ls">'+LEGEND.map(l=>'<div class="li"><div class="ld '+l.cls+'"></div><span class="ll">'+l.label+'</span></div>').join('')+'</div>';
}

      </div>
      <div>
        <h3>FINISHING THE GAME</h3>
        <p>Both teams play 12 drives. Add totals. High score wins. Write scores in the <strong>H2H boxes</strong> and circle the winner.</p>

        <ul>
          <li><strong>A</strong> &mdash; Top 8 AP &mdash; ~34 pts avg</li>
          <li><strong>B</strong> &mdash; AP #9&ndash;20 &mdash; ~29 pts avg</li>
          <li><strong>C</strong> &mdash; AP #21&ndash;34 &mdash; ~22 pts avg</li>
          <li><strong>D</strong> &mdash; Receiving votes &mdash; ~16 pts avg</li>
        </ul>
        <h3 style="margin-top:6px">SEASON PLAY</h3>
        <p>Play matchups across all 40 cards. Record on the two tally sheets. Highest total wins the national championship.</p>
      </div>
    </div>
    <div class="if"><span>RED = ROW &middot; BLUE = COLUMN &middot; 12 DRIVES PER TEAM</span><span>FINAL AP TOP 40 &middot; 2025-26</span></div>
  </div>`;
}

function teamCard(t){
  const rt=RT[t.off];
  const rtHtml=rt.map(r=>'<div class="ri"><strong>'+r.l+'</strong> '+r.r+' = '+r.p+'pts</div>').join('');
  const drives=Array(12).fill('<div class="db"></div>').join('');
  return `<div class="card">
    <div class="ch">
      <div class="ch-left">
        <div class="num">CARD ${t.num} &middot; ${rkStr(t.rank,t.rec)}</div>
        <div class="name">${t.name}</div>
        <div class="region">${t.region} &middot; ${t.tags}</div>
      </div>
      <div class="ch-right">
        <div class="conf">${t.region}</div>
        <div class="rec" style="margin-top:5px"><span class="sg ${gc(t.off)}" style="font-size:7pt">OFF ${t.off}</span></div>
        <div class="rec" style="margin-top:3px"><span class="sg ${gc(t.def)}" style="font-size:7pt">DEF ${t.def}</span></div>
      </div>
    </div>
    <div class="cb">
      <div class="gs">
        <div class="gl">OFFENSE GRID &mdash; RED = ROW &middot; BLUE = COL</div>
        ${buildGrid(t.grid)}
        <div class="dt"><div class="gl" style="margin-top:3px">12 DRIVES</div><div class="dr">${drives}</div></div>
      </div>
      <div class="sp"><div><div class="st">RESULT TABLE</div>${rtHtml}</div></div>
    </div>
    <div class="cf2">
      <div class="h2h-label">HEAD TO HEAD</div>
      <div class="h2h-row"><span class="h2h-team">${t.name}</span><span class="h2h-pts">PTS</span><div class="h2h-box"></div></div>
      <span class="h2h-vs">vs</span>
      <div class="h2h-row"><span class="h2h-team">Opponent</span><span class="h2h-pts">PTS</span><div class="h2h-box"></div></div>
      <div class="h2h-final">
        <span class="lbl">WINNER</span><div class="bx winner-box"></div>
        <span class="lbl">SZN PTS</span><div class="bx pts-box"></div>
      </div>
    </div>
    ${buildLegend()}
  </div>`;
}

function tallyCard(slice,label){
  const half=Math.ceil(slice.length/2);
  const hdr='<div class="tr2" style="margin-bottom:3px"><span class="tn2" style="font-size:5pt;color:#888">#</span><span class="tnm" style="font-size:5.5pt;color:#888">TEAM</span><span style="font-family:\'Bebas Neue\',sans-serif;font-size:5.5pt;color:#888;width:.22in;text-align:center;flex-shrink:0">W-L</span><span style="font-family:\'Bebas Neue\',sans-serif;font-size:5.5pt;color:var(--gr);width:.18in;text-align:center;flex-shrink:0">PTS</span></div>';
  function rows(arr){return arr.map(t=>'<div class="tr2"><span class="tn2">'+t.num+'</span><span class="tnm">'+t.name+'</span><div class="tsb"></div><div class="tpb"></div></div>').join('');}
  return `<div class="tally-card">
    <div class="th"><div class="tt">SEASON TALLY &mdash; ${label}</div><div class="ts">GRID COLLEGE FOOTBALL &middot; 2025-26 &middot; FINAL AP TOP 40</div></div>
    <div class="tb"><div class="tc">
      <div><div class="tct">${slice[0].num}&ndash;${slice[half-1].num}</div>${hdr}${rows(slice.slice(0,half))}</div>
      <div><div class="tct">${slice[half].num}&ndash;${slice[slice.length-1].num}</div>${hdr}${rows(slice.slice(half))}</div>
    </div></div>
    <div class="tf">
      <div class="tpk">
        <div class="tpi"><strong>BLOWOUT W</strong> 30</div><div class="tpi"><strong>WIN</strong> 25</div>
        <div class="tpi"><strong>CLOSE W</strong> 20</div><div class="tpi"><strong>OT WIN</strong> 15</div>
        <div class="tpi"><strong>OT LOSS</strong> 10</div><div class="tpi"><strong>LOSS/BLOWOUT L</strong> 5/0</div>
      </div>
      <div class="ttot"><span class="tl">CHAMPIONSHIP TOTAL</span><div class="tb2"></div></div>
    </div>
  </div>`;
}

const w=document.getElementById('wrap');
w.innerHTML=instrCard()+teams.map(teamCard).join('')
  +tallyCard(teams.slice(0,20),'TEAMS 01–20')
  +tallyCard(teams.slice(20),'TEAMS 21–40');
</script>
</body>
</html>
