function hexToRgb(hex){
  hex=hex.replace('#','');
  if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');
  return{r:parseInt(hex.substring(0,2),16),g:parseInt(hex.substring(2,4),16),b:parseInt(hex.substring(4,6),16)};
}
function darken(hex,amt){const{r,g,b}=hexToRgb(hex);return`rgb(${Math.max(0,r-amt)},${Math.max(0,g-amt)},${Math.max(0,b-amt)})`;}
function lighten(hex,amt){const{r,g,b}=hexToRgb(hex);return`rgb(${Math.min(255,r+amt)},${Math.min(255,g+amt)},${Math.min(255,b+amt)})`;}

function cellStyle(pts,bg,ac){
  // All cells are 7-13. Shade by value.
  const intensity = (pts-7)/(13-7); // 0 to 1
  const bgColor = pts>=12 ? lighten(bg,30) : pts>=10 ? lighten(bg,15) : pts>=8 ? lighten(bg,5) : darken(bg,5);
  const textColor = pts>=12 ? ac : 'rgba(255,255,255,0.85)';
  const subColor = pts>=12 ? ac : 'rgba(255,255,255,0.4)';
  return{bgColor,textColor,subColor};
}

function cellLabel(pts,p1,p2){
  if(pts>=13) return '🔥 HOT';
  if(pts>=12) return p1.substring(0,7);
  if(pts>=10) return p2.substring(0,7);
  if(pts>=8)  return 'FLOW';
  return 'GRIND';
}

function ortgTier(ortg){
  if(ortg>=122)return{label:'ELITE',color:'#FFD700'};
  if(ortg>=118)return{label:'STRONG',color:'#C0C0C0'};
  if(ortg>=115)return{label:'AVERAGE',color:'#CD7F32'};
  if(ortg>=112)return{label:'BELOW AVG',color:'#888888'};
  return{label:'REBUILDING',color:'#555555'};
}

function renderCard(t){
  const tier=ortgTier(t.ortg);
  const cardBg=darken(t.bg,50);
  const borderCol=lighten(t.bg,12);

  let gridHTML=`<div class="corner"></div>`;
  for(let c=1;c<=6;c++) gridHTML+=`<div class="col-hdr" style="color:${t.ac}">${c}</div>`;

  for(let row=0;row<6;row++){
    gridHTML+=`<div class="row-hdr" style="color:${t.ac}">${row+1}</div>`;
    for(let col=0;col<6;col++){
      const pts=t.cells[row*6+col];
      const{bgColor,textColor,subColor}=cellStyle(pts,t.bg,t.ac);
      const lbl=cellLabel(pts,t.p1,t.p2);
      gridHTML+=`<div class="gc" style="background:${bgColor};border-color:${lighten(t.bg,20)}">
        <div class="gc-pts" style="color:${textColor}">${pts}</div>
        <div class="gc-lbl" style="color:${subColor}">${lbl}</div>
      </div>`;
    }
  }

  return`<div class="card" style="background:${cardBg};border:2px solid ${borderCol}">
    <div class="card-header" style="background:${t.hdr}">
      <div class="logo-block">
        <div class="logo-text" style="color:${t.ac}">${t.n}</div>
        <div class="team-city" style="color:rgba(255,255,255,0.55)">${t.c}</div>
      </div>
      <div class="hdr-div"></div>
      <div class="hdr-stats">
        <div class="hstat"><div class="hstat-val">${t.rec}</div><div class="hstat-lbl">RECORD</div></div>
        <div class="hstat"><div class="hstat-val">${t.ortg}</div><div class="hstat-lbl">ORTG</div></div>
        <div class="hstat"><div class="hstat-val">${t.rnk}</div><div class="hstat-lbl">OFF RNK</div></div>
        <div class="hstat"><div class="hstat-val">~${t.game_avg}</div><div class="hstat-lbl">AVG PTS</div></div>
      </div>
      <div class="hdr-right">
        <div class="game-lbl">GRID BASKETBALL</div>
        <div class="season-lbl">2025–26 Season</div>
      </div>
    </div>
    <div class="card-body">
      <div class="grid-section">
        <div class="grid-lbl">
          <span>🎲 RED DIE → COLUMN &nbsp;|&nbsp; BLUE DIE → ROW</span>
          <span>ROLL 12 TIMES · ADD ALL POINTS · HIGHER SCORE WINS</span>
        </div>
        <div class="dice-grid">${gridHTML}</div>
      </div>
      <div class="right-panel">
        <div class="panel-title">12 Rolls</div>
        <div class="roll-grid">${Array.from({length:12},(_,i)=>`<div class="roll-box">R${i+1}</div>`).join('')}</div>
        <div class="div-line"></div>
        <div class="total-row"><div class="total-lbl">Score</div><div class="total-box"></div></div>
        <div class="div-line"></div>
        <div class="how-to">Red = column<br>Blue = row<br>Roll 12×<br>Add points<br><strong>Higher wins</strong></div>
      </div>
    </div>
    <div class="card-footer" style="background:${darken(t.bg,55)}">
      <div class="footer-txt" style="color:rgba(255,255,255,0.38)">GRID BASKETBALL · ${t.c} ${t.n} · 2025–26</div>
      <div class="ortg-pill" style="background:${tier.color};color:#000">${tier.label}</div>
      <div class="footer-txt" style="color:rgba(255,255,255,0.38)">${t.p1} · ${t.p2}</div>
    </div>
  </div>`;
}

document.addEventListener('DOMContentLoaded',()=>{
  let html=`<div class="conf-header">— EASTERN CONFERENCE —</div>`;
  teams.slice(0,15).forEach(t=>html+=renderCard(t));
  html+=`<div class="conf-header">— WESTERN CONFERENCE —</div>`;
  teams.slice(15).forEach(t=>html+=renderCard(t));
  document.body.insertAdjacentHTML('beforeend',html);
});
</script>
</body>
</html>
