<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Hockey - NHL Teams 3x5</title>
    <style>
        @page {
            size: 3in 5in;
            margin: 0;
        }
        
        @media print {
            .no-print { display: none; }
            .page-break { page-break-after: always; }
            body { margin: 0; padding: 0; }
            .card {
                transform: rotate(90deg);
                transform-origin: top left;
                position: relative;
                left: 3in;
				top: .15in;
            }
            .print-grid-only .scorecard-card { display: none; }
            .print-scorecard-only .grid-card { display: none; }
        }
        
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            font-size: 11px;
        }
        
        .controls {
            text-align: center;
            padding: 20px;
            background: #FFF;
            border: 3px solid #000;
            margin-bottom: 20px;
        }
        
        .controls h2 {
            margin-top: 0;
            color: #000;
        }
        
        .controls select {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid #000;
            background: #fff;
            margin: 10px;
        }
        
        .controls button {
            padding: 15px 30px;
            margin: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid #000;
            background: #fff;
        }
        
        .controls button:hover {
            background: #E8E8E8;
        }
        
        .card {
            width: 3in;
            height: 5in;
            border: 3px solid #000;
            padding: 0.12in;
            background: white;
            margin: 0 auto 20px auto;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        
        .card h1 {
            text-align: center;
            margin: 0 0 3px 0;
            font-size: 13px;
            font-weight: bold;
        }
        
        .team-header {
            text-align: center;
            margin: 0 0 2px 0;
            padding: 4px;
            border: 2px solid #000;
            font-weight: bold;
            font-size: 11px;
        }
        
        .goalie-stats {
            text-align: center;
            margin: 0 0 4px 0;
            padding: 2px;
            font-size: 7px;
            border: 1px solid #666;
            background: #F5F5F5;
        }
        
        .grid-section {
            border: 2px solid #000;
            padding: 4px;
            background: #FCFCFC;
            margin-bottom: 4px;
        }
        
        .grid-section h3 {
            margin: 0 0 3px 0;
            font-size: 8px;
            text-align: center;
            font-weight: bold;
        }
        
        .grid {
            display: grid;
            grid-template-columns: 15px repeat(6, 26px);
            grid-template-rows: 15px repeat(6, 26px);
            gap: 1px;
            background: #333;
            margin: 0 auto;
            width: fit-content;
        }
        
        .cell {
            background: #E8E8E8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: bold;
            border: 1px solid #666;
        }
        
        .label {
            background: #333;
            color: #fff;
            font-size: 8px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .ice { background: #E8F4F9; }
        .goal { background: #FFB6C1; color: #000; font-size: 7px; }
        .goalie { background: #E8E8E8; color: #000; font-size: 7px; }
        .block { background: #F0F0F0; color: #000; font-size: 7px; }
        .miss { background: #FCFCFC; color: #000; font-size: 7px; }
        
        .legend {
            margin-top: 3px;
            font-size: 5.5px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1px;
            line-height: 1.2;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 2px;
        }
        
        .legend-box {
            width: 6px;
            height: 6px;
            border: 1px solid #000;
            flex-shrink: 0;
        }
        
        .scorecard {
            border: 2px solid #000;
            padding: 3px;
            background: #FCFCFC;
            flex: 1;
        }
        
        .scorecard h3 {
            margin: 0 0 2px 0;
            font-size: 8px;
            font-weight: bold;
            text-align: center;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 7px;
        }
        
        th, td {
            border: 1px solid #000;
            padding: 1px;
            text-align: center;
        }
        
        th {
            background: #E8E8E8;
            font-weight: bold;
        }
        
        .period-header {
            background: #F0F0F0;
            font-weight: bold;
        }
        
        .total-row {
            background: #FFEB99;
            font-weight: bold;
        }
    </style>
</head>

            <label>

        <div style="margin-top: 15px;">

        </div>
    </div>

        function getTextColor(bgColor) {
            const r = parseInt(bgColor.substr(1,2), 16);
            const g = parseInt(bgColor.substr(3,2), 16);
            const b = parseInt(bgColor.substr(5,2), 16);
            const brightness = (r * 299 + g * 587 + b * 114) / 1000;
            return brightness > 128 ? '#000000' : '#FFFFFF';
        }
        
        function renderTeamCard(teamKey) {
            const team = nhlTeams[teamKey];
            const colors = teamColors[teamKey];
            const grid = team.grid;
            const textColor = getTextColor(colors.primary);
            
            // CARD 1 - GRID
            let html = `
            <div class="card grid-card page-break">
                <h1>GRID HOCKEY</h1>
                
                <div class="team-header" style="background: ${colors.primary}; color: ${textColor}; border-color: ${colors.secondary};">
                    ${team.name}
                </div>
                
                <div class="goalie-stats">
                    SV%: ${team.savePct} • GAA: ${team.gaa} • ${team.strength.toUpperCase()} Goaltending
                </div>
                
                <div class="grid-section" style="flex: 1;">
                    <h3>SHOT GRID (Roll 2d6)</h3>
                    <div class="grid">`;
            
            html += '<div class="label"></div>';
            for (let col = 1; col <= 6; col++) {
                html += `<div class="label">${col}</div>`;
            }

                html += `<div class="label">${rowIndex + 1}</div>`;
                row.forEach(cell => {
                    let className = 'cell';
                    let content = '';
                    
                    if (cell === 'ice') className += ' ice';
                    else if (cell === 'goal') { className += ' goal'; content = 'GOAL'; }
                    else if (cell === 'goalie') { className += ' goalie'; content = 'SAVE'; }
                    else if (cell === 'block') { className += ' block'; content = 'BLK'; }
                    else if (cell === 'miss') { className += ' miss'; content = 'MISS'; }
                    
                    html += `<div class="${className}">${content}</div>`;
                });
            });
            
            html += `
                    </div><br>
                    <div class="legend">
                        <div class="legend-item"><span class="legend-box" style="background: #FFB6C1;"></span>GOAL ALLOWED = Score! ✅</div>
                        <div class="legend-item"><span class="legend-box" style="background: #E8E8E8;"></span>SAVE = No goal ☐</div>
                        <div class="legend-item"><span class="legend-box" style="background: #F0F0F0;"></span>BLK = Blocked ☐</div>

            } else if (printOption === 'scorecard') {

            }
        };

            const sel = document.getElementById('teamSelect');
            const sortedKeys = Object.keys(nhlTeams).sort((a, b) => 
                nhlTeams[a].name.localeCompare(nhlTeams[b].name)
            );
            sortedKeys.forEach(key => {
                const opt = document.createElement('option');
                opt.value = key;
                opt.textContent = nhlTeams[key].name;
                sel.appendChild(opt);
            });
